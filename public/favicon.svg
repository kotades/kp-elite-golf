<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Shield / Rounded Square -->
  <rect width="512" height="512" rx="128" fill="#0B2B1F"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#D4AF37" stroke-width="16" stroke-opacity="0.8"/>
  
  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="200" fill="url(#grad)" opacity="0.15"/>
  
  <!-- Trophy Outline & Fill -->
  <g transform="translate(106, 96) scale(12)">
    <!-- Handles -->
    <path d="M6 9C3.8 9 2 7.2 2 5C2 3.8 2.5 2.8 3.3 2.1C3.7 1.7 4.2 1.4 4.8 1.2" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <path d="M19 9C21.2 9 23 7.2 23 5C23 3.8 22.5 2.8 21.7 2.1C21.3 1.7 20.8 1.4 20.2 1.2" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Cup Body -->
    <path d="M5 2H20V9C20 13.1 16.6 16.5 12.5 16.5C8.4 16.5 5 13.1 5 9V2Z" fill="#D4AF37" stroke="#F3E5AB" stroke-width="1.5"/>
    
    <!-- Stem & Base -->
    <path d="M12.5 16.5V20" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M7 22H18" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Crown Stars / PGA Accent -->
    <circle cx="12.5" cy="7" r="1.5" fill="#0B2B1F"/>
  </g>

  <!-- Definition for Gradients -->
  <defs>
    <radialGradient id="grad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(200)">
      <stop stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#154734" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
